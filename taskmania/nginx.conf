server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames, so these can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Forwards API calls to the Go service so the browser sees a single origin
  # and CORS never comes into play.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A single-page app owns its routing, so unknown paths return the shell
  # rather than a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
